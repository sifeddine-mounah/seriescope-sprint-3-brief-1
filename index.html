  <body class="bg-[#101010] font-[inter]">
    <header>
      <div class="headers p-5 flex gap-5 items-center">
        <img src="/assets/Logo.png" alt="SerieScope Logo" />
        <h1 class="text-[#FAFAFA]">Sériescope</h1>
      </div>
    </header>
    <main class="p-5">
      <div>
        <h2 class="text-[#FAFAFA] text-[25px]">Explore les séries TV</h2>
        <p class="text-[#BABABA] text-[11px]">
          Retrouve tes séries préférées et enrichis le catalogue.
        </p>
      </div>

      <section class="bg-[#191919] border border-[#393939] rounded-lg p-4 mt-5">
        <div>
          <h3 class="text-[#FAFAFA]">Ajouter une série</h3>
          <p class="text-[#BABABA] text-[11px]">
            Les champs marqués d’un * sont obligatoires.
          </p>
        </div>
        <div class="lg:flex flex-col md:flex-row gap-5">
          <div class="flex flex-col lg:w-[50%]">
            <label for="nom" class="text-[#FAFAFA] text-[12px]">
              Nom de la série *
            </label>
            <input
              id="serie"
              type="text"
              placeholder="Ex. The Bear "
              class="border border-[#393939] rounded-lg w-full placeholder: text-[#BABABA] placeholder:p-2.5 placeholder:text-[9px]"
            />
          </div>
          <div class="flex flex-col lg:w-[50%]">
            <label for="genre" class="text-[#FAFAFA] text-[12px]">
              Genre(s) *
            </label>
            <input
              id="category"
              type="text"
              placeholder="Ex. Drame, Comédie "
              class="border border-[#393939] rounded-lg w-full placeholder: text-[#BABABA] placeholder:p-2.5 placeholder:text-[9px]"
            />
          </div>
        </div>

        <label for="description" class="text-[#FAFAFA] text-[12px]"
          >Description</label
        ><br />
        <textarea
          id="description"
          placeholder="Résume la série en quelques mots…"
          class="text-[#BABABA] w-full h-12.5 p-2.5 rounded-lg border border-gray-300 placeholder:text-gray-400 placeholder:text-[9px]"
        ></textarea>

        <button
          id="ajoute-btn"
          class="bg-[#FAFAFA] w-full rounded-lg mt-5 h-8.75 lg:w-37.5"
        >
          + Ajouter la série
        </button>
      </section>

      <section class="bg-[#191919] border border-[#393939] rounded-lg p-4 mt-5">
        <div>
          <h3 class="text-[#FAFAFA]">Catalogue des séries</h3>
          <p class="text-[#BABABA] text-[11px]">
            Recherche par nom ou explore un genre.
          </p>
        </div>

        <div class="flex flex-col lg:flex-row gap-5">
          <form id="formulaire" class="flex flex-col gap-1 lg:w-[50%]">
            <label for="search" class="text-[#FAFAFA] text-[12px]">
              Recherche
            </label>

            <input
              id="search"
              type="text"
              placeholder="Ex. Breaking Bad"
              class="text-[#EEEEEE] border border-[#393939] rounded-lg w-full placeholder:text-[#BABABA] placeholder:text-[9px] p-2.5"
            />

            <label for="genre" class="text-[#FAFAFA] text-[12px]">
              Genre(s) *
            </label>

            <div class="flex gap-3 items-center">
              <select
                name="genres"
                id="list-genre"
                class="text-[#BABABA] h-8.75 border border-[#393939] rounded-lg w-full"
              >
                <option value="Drama">Drame</option>
                <option value="Fantasy">Fantastique</option>
                <option value="Action">Action</option>
                <option value="Adventure">Adventure</option>
                <option value="Crime">Crime</option>
                <option value="Espionage">Espionnage</option>
                <option value="Science-Fiction">Science-fiction</option>
                <option value="Mystery">Mystère</option>
                <option value="Comedy">Comédie</option>
                <option value="Family">Famille</option>
                <option value="Horror">Horreur</option>
                <option value="Music">Musique</option>
                <option value="Romance">Romance</option>
              </select>

              <button
                id="resetButton"
                class="bg-[#191919] w-full rounded-lg h-8.75 border border-[#393939] text-[#FAFAFA]"
              >
                Réinitialiser
              </button>
            </div>
          </form>
        </div>
      </section>

      <p class="text-[#BABABA] text-[11px] mt-5">6 séries affichées</p>

      <div
        id="carteContainer"
        class="grid-cols-1 md:grid grid-cols-2 gap-6 lg:grid-cols-3 gap-6"
